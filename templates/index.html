<!-- templates/index.html (replace the previous version) -->
<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Register Wajah – Otomatis (face-api.js)</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <script defer src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.min.js"></script>
  <style>
    :root { color-scheme: dark; }
    body { font-family: system-ui, sans-serif; margin: 0; padding: 0; background:#0b0b0b; color:#eaeaea;}
    header { padding: 14px 16px; background:#111; position: sticky; top:0; display:flex; gap:16px; align-items:center; }
    .badge { padding:4px 10px; border-radius:999px; background:#222; border:1px solid #333; }
    .row { display:grid; grid-template-columns: 1fr 1.2fr; gap:16px; padding:16px; }
    .card { background:#111; border:1px solid #222; border-radius:12px; padding:16px; }
    .video-wrap { position:relative; width:100%; aspect-ratio:16/9; background:#000; border-radius:12px; overflow:hidden; border:1px solid #222; }
    video, canvas { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
    .grid { display:grid; grid-template-columns: repeat(3, 1fr); gap:10px; }
    .thumb { width:100%; border-radius:10px; border:1px solid #222; background:#000; }
    .text-dim { color:#bcbcbc; }
    .countdown { font-variant-numeric: tabular-nums; }
    .dot { width:10px; height:10px; border-radius:999px; display:inline-block; margin-right:6px; }
    .kbd { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; padding:2px 6px; border-radius:6px; background:#1a1a1a; border:1px solid #333;}

    /* Guide overlay */
    .guide-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 16px;
      pointer-events: none;
      z-index: 30;
      opacity: 0;
      transition: opacity .25s ease;
    }
    .guide-overlay .hud {
      max-width: 92%;
      background: rgba(0,0,0,0.55);
      border: 1px solid #333;
      color: #fff;
      padding: 10px 14px;
      border-radius: 12px;
      backdrop-filter: blur(2px);
      font-weight: 600;
      text-shadow: 0 1px 2px rgba(0,0,0,.6);
    }

    /* MIRROR camera & overlay (text overlay stays normal) */
    .mirror { transform: scaleX(-1); transform-origin: center; will-change: transform; }
  </style>
</head>
<body>
<header>
  <div class="badge" id="mode">Mode: IDLE</div>
  <div class="badge">MASTER: {{master}}</div>
  <div class="badge" id="user">User: -</div>
  <div class="badge" id="step">Step: 0/3</div>
  <div class="badge" id="face"><span class="dot" style="background:#a00;"></span>Face: Tidak Ada</div>
</header>

<div class="row">
  <div class="card">
    <div id="lastScan" class="text-dim">Terakhir: -</div>
    <div style="margin-top:6px;" id="msg"></div>

    <div class="card" style="margin-top:14px;">
      <div id="previewTitle" class="text-dim">Preview (3 Foto Terpilih):</div>
      <div class="grid" style="margin-top:10px;">
        <img id="p0" class="thumb" src="" alt="">
        <img id="p1" class="thumb" src="" alt="">
        <img id="p2" class="thumb" src="" alt="">
      </div>
      <div style="margin-top:10px;" class="text-dim">
        Pindai barcode lalu tekan <span class="kbd">Enter</span>.
      </div>
      <div style="margin-top:10px;">
        <span id="reask" class="text-dim">-</span>
        <span id="countdown" class="countdown"></span>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="video-wrap">
      <video id="cam" class="mirror" playsinline muted></video>
      <canvas id="overlay" class="mirror"></canvas>

      <div id="guideOverlay" class="guide-overlay">
        <div class="hud">
          <span id="guideText">Panduan: -</span>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="/static/app.js"></script>
</body>
</html>
